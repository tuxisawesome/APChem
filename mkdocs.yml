      - "Unit 2 · Foundations II":
          - units/02-foundations-2/index.md
          - units/02-foundations-2/strong-weak-acids-neutralization.md
          - units/02-foundations-2/net-ionic-equations-titration.md
          - units/02-foundations-2/solubility-rules.md
          - units/02-foundations-2/nitrogen-bases-ammonia.md
          - units/02-foundations-2/oxidation-numbers.md
          - units/02-foundations-2/balancing-redox.md
      - "Unit 3 · Equilibrium":
          - units/03-equilibrium/index.md
          - units/03-equilibrium/chemical-equilibrium.md
          - units/03-equilibrium/manipulating-k.md
          - units/03-equilibrium/reaction-quotient.md
          - units/03-equilibrium/rice-tables.md
          - units/03-equilibrium/le-chatelier.md
      - "Unit 4 · Acid–Base":
          - units/04-acid-base/index.md
          - units/04-acid-base/acids-bases-intro.md
          - units/04-acid-base/acid-base-theories.md
          - units/04-acid-base/amphoteric-polyprotic.md
      - "Unit 5 · Thermodynamics":
