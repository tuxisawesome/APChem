      - "Unit 7 · Kinetics": units/07-kinetics/index.md
      - "Unit 8 · Atomic Structure": units/08-atomic-structure/index.md
      - "Unit 9 · Bonding": units/09-bonding/index.md
      - "Unit 10 · IMFs, Gases & Solutions": units/10-imf-gases-solutions/index.md
      - "Unit 11 · Analysis Methods": units/11-analysis/index.md
  - Toolkit:
      - Formulas: formulas.md
      - Memorize: memorize.md
      - Reference Sheets: reference.md
      - Study Skills: study-skills.md
      - Class Log: class-log.md
      - Teacher Quotes: quotes.md
      - Notebook Scans:
          - scans/index.md
          - scans/10-1.md
          - scans/10-2.md
      - Tags: tags.md
  - Settings & Help:
      - Settings: settings.md
      - Editing the Wiki:
          - contributing/index.md
          - contributing/style-guide.md
          - contributing/diagrams.md
