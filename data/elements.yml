# The elements, for the Molar Mass Calculator (docs/molar-mass.md, marker <!-- wiki:molar-mass -->).
# Atomic masses are copied exactly from the AP Chemistry periodic table the class uses
# (docs/assets/resources/periodic-table.pdf, © College Board), so answers match the exam.
# m: "" means the AP table lists no atomic mass (no stable isotope).
# Symbols and masses are quoted: unquoted, YAML would read No (nobelium) as false and 16.00 as 16.0.
